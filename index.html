<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gerador de Codigos - GRATIFLIX</title>
<style>
body{font-family:Arial;background:#000;color:#fff;margin:0;padding:15px;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{border:2px solid #ffcc00;border-radius:16px;padding:18px;max-width:400px;width:100%;background:#111;text-align:center}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin:8px 0;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
#telaSenha{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<div id="telaSenha">
<div class="box" style="border-color:#ff4444">
<h2 style="color:#ffcc00">🔒 AREA RESTRITA</h2>
<p style="color:#ccc;font-size:13px">Esse gerador é só do admin. Digite a senha para entrar:</p>
<input type="password" id="inputSenha" placeholder="Digite sua senha">
<button onclick="verificarSenha()" style="background:#ffcc00;color:#000">ENTRAR</button>
<p id="erroSenha" style="color:#ff4444;display:none;font-size:12px;margin-top:8px">Senha errada!</p>
</div>
</div>

<div class="box">
<h2 style="color:#ffcc00">🔑 GERADOR DE CÓDIGOS - GRATIFLIX</h2>
<p style="color:#aaa;font-size:12px">Use após confirmar PIX na chave 025.446.319-37</p>
<label style="text-align:left;display:block">Plano pago:</label>
<select id="plano">
<option value="1">1 DIA - R$2,99</option>
<option value="7">1 SEMANA - R$10,00</option>
<option value="30" selected>1 MES - R$28,00</option>
<option value="365">1 ANO - R$300,00</option>
</select>
<button onclick="gerarCodigo()" style="background:#ffcc00;color:#000">GERAR CÓDIGO DESBLOQUEIO</button>
<div id="resultado" style="background:#222;border-radius:10px;padding:12px;margin:10px 0;font-weight:900;color:#00ff88;font-size:16px;word-break:break-all;min-height:40px;display:flex;align-items:center;justify-content:center"></div>
<button onclick="copiarZap()" style="background:#25d366;color:#fff">📋 COPIAR E ENVIAR NO ZAP</button>
<button onclick="sair()" style="background:#333;color:#fff;font-size:12px;margin-top:12px">SAIR / TROCAR SENHA</button>
</div>

<script>
const SENHA_MESTRA = "GRATIDAO2026"; // <-- SUA SENHA AQUI, pode trocar
const SEGREDO = "GRATIDAO41_BANCO_2026";
const KEY_AUTH = "grati_auth_admin";

function gerarHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(36).toUpperCase();}

function verificarSenha(){
  let s = document.getElementById('inputSenha').value.trim();
  if(s === SENHA_MESTRA){
    localStorage.setItem(KEY_AUTH, "ok");
    document.getElementById('telaSenha').style.display='none';
  } else {
    document.getElementById('erroSenha').style.display='block';
  }
}

function checarLogin(){
  if(localStorage.getItem(KEY_AUTH) === "ok"){
    document.getElementById('telaSenha').style.display='none';
  }
}

function sair(){
  localStorage.removeItem(KEY_AUTH);
  location.reload();
}

function gerarCodigo(){
  let dias = parseInt(document.getElementById('plano').value);
  let expira = Date.now() + (dias * 24 * 60 * 60 * 1000);
  let expira36 = expira.toString(36).toUpperCase();
  let base = dias + "|" + expira;
  let hash = gerarHash(base + "|" + SEGREDO).substring(0,6);
  let codigo = "GRATI-" + dias + "-" + expira36 + "-" + hash;
  document.getElementById('resultado').innerText = codigo;
}

function copiarZap(){
  let codigo = document.getElementById('resultado').innerText;
  if(!codigo){alert("Gere um codigo primeiro!");return;}
  let texto = encodeURIComponent("✅ Seu codigo de desbloqueio liberado!\n\n" + codigo + "\n\nCole no app em VER PLANOS > JA TENHO CODIGO > DESBLOQUEAR AGORA\n\nObrigado!");
  navigator.clipboard.writeText(codigo);
  window.open("https://wa.me/?text=" + texto, "_blank");
}

checarLogin();
</script>
</body>
</html>
